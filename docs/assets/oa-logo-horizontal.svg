<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <defs>

    <radialGradient id="bg" cx="20%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#180800"/>
      <stop offset="100%" stop-color="#070200"/>
    </radialGradient>

    <!-- Root glow -->
    <filter id="rootGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- L1 glow -->
    <filter id="l1Glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- L2 glow -->
    <filter id="l2Glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes rootPulse {
        0%, 100% { opacity: 0.88; }
        50%       { opacity: 1.00; }
      }
      .root { animation: rootPulse 3.5s ease-in-out infinite; }
    </style>

  </defs>

  <!-- Background -->
  <rect width="560" height="200" rx="16" fill="url(#bg)"/>

  <!--
    HORIZONTAL TREE GEOMETRY

    Root:   (50, 100)
    L1_A:  (155, 40)   [upper]
    L1_B:  (155, 100)  [middle]
    L1_C:  (155, 160)  [lower]

    L2 from A:  (250, 18)  (250, 58)
    L2 from B:  (250, 78)  (250, 122)
    L2 from C:  (250, 142) (250, 178)
  -->

  <!-- ── ROOT → L1 LINES ── -->
  <line x1="50"  y1="100" x2="155" y2="40"  stroke="#c97706" stroke-width="1.5" stroke-linecap="round" opacity="0.50"/>
  <line x1="50"  y1="100" x2="155" y2="100" stroke="#c97706" stroke-width="1.5" stroke-linecap="round" opacity="0.50"/>
  <line x1="50"  y1="100" x2="155" y2="160" stroke="#c97706" stroke-width="1.5" stroke-linecap="round" opacity="0.50"/>

  <!-- ── L1 → L2 LINES ── -->
  <line x1="155" y1="40"  x2="250" y2="18"  stroke="#d06020" stroke-width="1.1" stroke-linecap="round" opacity="0.42"/>
  <line x1="155" y1="40"  x2="250" y2="58"  stroke="#d06020" stroke-width="1.1" stroke-linecap="round" opacity="0.42"/>
  <line x1="155" y1="100" x2="250" y2="78"  stroke="#d06020" stroke-width="1.1" stroke-linecap="round" opacity="0.42"/>
  <line x1="155" y1="100" x2="250" y2="122" stroke="#d06020" stroke-width="1.1" stroke-linecap="round" opacity="0.42"/>
  <line x1="155" y1="160" x2="250" y2="142" stroke="#d06020" stroke-width="1.1" stroke-linecap="round" opacity="0.42"/>
  <line x1="155" y1="160" x2="250" y2="178" stroke="#d06020" stroke-width="1.1" stroke-linecap="round" opacity="0.42"/>

  <!-- ── L2 NODES ── -->
  <circle cx="250" cy="18"  r="6" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="250" cy="58"  r="6" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="250" cy="78"  r="6" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="250" cy="122" r="6" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="250" cy="142" r="6" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="250" cy="178" r="6" fill="#EA580C" filter="url(#l2Glow)"/>

  <!-- ── L1 NODES ── -->
  <circle cx="155" cy="40"  r="9" fill="#D97706" filter="url(#l1Glow)"/>
  <circle cx="155" cy="100" r="9" fill="#D97706" filter="url(#l1Glow)"/>
  <circle cx="155" cy="160" r="9" fill="#D97706" filter="url(#l1Glow)"/>

  <!-- ── ROOT NODE ── -->
  <circle cx="50" cy="100" r="15" fill="#F59E0B" class="root" filter="url(#rootGlow)"/>

  <!-- ── SEPARATOR ── -->
  <line x1="285" y1="28" x2="285" y2="172" stroke="#D97706" stroke-width="0.6" opacity="0.25"/>

  <!-- ── WORDMARK ── -->
  <!-- "Open" white + "-Agents" amber, bold, centered vertically -->
  <text y="117"
        font-family="'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif"
        font-weight="800"
        font-size="40"
        letter-spacing="-0.5">
    <tspan x="305" fill="#ffffff">Open</tspan><tspan fill="#D97706">-Agents</tspan>
  </text>

  <!-- ── SMALL LABEL ── -->
  <text x="306" y="138"
        font-family="'Segoe UI',Arial,system-ui,sans-serif"
        font-size="10.5"
        fill="#D97706"
        opacity="0.55"
        letter-spacing="1.8">AGENT ORCHESTRATION</text>

</svg>
