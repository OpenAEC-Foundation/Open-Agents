<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%">
  <defs>

    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%"   stop-color="#0f0400"/>
      <stop offset="25%"  stop-color="#7c2d12"/>
      <stop offset="55%"  stop-color="#b45309"/>
      <stop offset="80%"  stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <filter id="rootGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="l1Glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="l2Glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      .content { animation: appear 1.1s ease-out 0.1s both; }
      @keyframes pulse { 0%,100% { opacity:.88; } 50% { opacity:1; } }
      .root { animation: pulse 3.5s ease-in-out infinite; }
    </style>

  </defs>

  <!-- Wave background — same S-curve as capsule-render waving type -->
  <path d="M0,0 L900,0 L900,204 C750,248 600,160 450,204 C300,248 150,160 0,204 Z"
        fill="url(#grad)"/>

  <!-- TEXT — left side -->
  <g class="content">
    <text x="52" y="110"
          font-family="'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif"
          font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-1">Open-Agents</text>
    <text x="55" y="150"
          font-family="'Segoe UI',Arial,system-ui,sans-serif"
          font-size="20" fill="#ffffff" opacity="0.82">Spawn AI agents. Orchestrate anything. Build free.</text>
  </g>

  <!--
    AGENT TREE — right side
    Root: (622, 105)  d1=68  d2=45

    L1 A  315° → (670, 57)
    L1 B    0° → (690, 105)
    L1 C   45° → (670, 153)

    A → A1 280° → (678, 13)   A2 350° → (714, 49)
    B → B1 325° → (727, 79)   B2  35° → (727, 131)
    C → C1  10° → (714, 161)  C2  80° → (678, 188)
  -->

  <!-- Root → L1 -->
  <line x1="622" y1="105" x2="670" y2="57"  stroke="#F5C060" stroke-width="2.0" stroke-linecap="round" opacity="0.70"/>
  <line x1="622" y1="105" x2="690" y2="105" stroke="#F5C060" stroke-width="2.0" stroke-linecap="round" opacity="0.70"/>
  <line x1="622" y1="105" x2="670" y2="153" stroke="#F5C060" stroke-width="2.0" stroke-linecap="round" opacity="0.70"/>

  <!-- L1 → L2 -->
  <line x1="670" y1="57"  x2="678" y2="13"  stroke="#EA8030" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>
  <line x1="670" y1="57"  x2="714" y2="49"  stroke="#EA8030" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>
  <line x1="690" y1="105" x2="727" y2="79"  stroke="#EA8030" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>
  <line x1="690" y1="105" x2="727" y2="131" stroke="#EA8030" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>
  <line x1="670" y1="153" x2="714" y2="161" stroke="#EA8030" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>
  <line x1="670" y1="153" x2="678" y2="188" stroke="#EA8030" stroke-width="1.5" stroke-linecap="round" opacity="0.60"/>

  <!-- L2 nodes -->
  <circle cx="678" cy="13"  r="7" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="714" cy="49"  r="7" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="727" cy="79"  r="7" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="727" cy="131" r="7" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="714" cy="161" r="7" fill="#EA580C" filter="url(#l2Glow)"/>
  <circle cx="678" cy="188" r="7" fill="#EA580C" filter="url(#l2Glow)"/>

  <!-- L1 nodes -->
  <circle cx="670" cy="57"  r="11" fill="#D97706" filter="url(#l1Glow)"/>
  <circle cx="690" cy="105" r="11" fill="#D97706" filter="url(#l1Glow)"/>
  <circle cx="670" cy="153" r="11" fill="#D97706" filter="url(#l1Glow)"/>

  <!-- Root -->
  <circle cx="622" cy="105" r="16" fill="#F59E0B" class="root" filter="url(#rootGlow)"/>

</svg>
