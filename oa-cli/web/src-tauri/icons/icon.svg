<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0830"/>
      <stop offset="100%" stop-color="#3a0d6e"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#b44fff"/>
    </linearGradient>
    <linearGradient id="outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3fc0"/>
      <stop offset="100%" stop-color="#8a2fd0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bg)"/>
  <!-- Connection lines from center to outer nodes -->
  <line x1="256" y1="256" x2="386" y2="256" stroke="#6050c8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="256" x2="321" y2="143" stroke="#6050c8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="256" x2="191" y2="143" stroke="#6050c8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="256" x2="126" y2="256" stroke="#6050c8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="256" x2="191" y2="369" stroke="#6050c8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="256" x2="321" y2="369" stroke="#6050c8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- Outer nodes (agents) -->
  <circle cx="386" cy="256" r="30" fill="url(#outer)" filter="url(#glow)"/>
  <circle cx="321" cy="143" r="30" fill="url(#outer)" filter="url(#glow)"/>
  <circle cx="191" cy="143" r="30" fill="url(#outer)" filter="url(#glow)"/>
  <circle cx="126" cy="256" r="30" fill="url(#outer)" filter="url(#glow)"/>
  <circle cx="191" cy="369" r="30" fill="url(#outer)" filter="url(#glow)"/>
  <circle cx="321" cy="369" r="30" fill="url(#outer)" filter="url(#glow)"/>
  <!-- Outer node inner dots (white accent) -->
  <circle cx="386" cy="256" r="12" fill="white" opacity="0.85"/>
  <circle cx="321" cy="143" r="12" fill="white" opacity="0.85"/>
  <circle cx="191" cy="143" r="12" fill="white" opacity="0.85"/>
  <circle cx="126" cy="256" r="12" fill="white" opacity="0.85"/>
  <circle cx="191" cy="369" r="12" fill="white" opacity="0.85"/>
  <circle cx="321" cy="369" r="12" fill="white" opacity="0.85"/>
  <!-- Central orchestrator node -->
  <circle cx="256" cy="256" r="58" fill="url(#center)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="white" opacity="0.95"/>
  <circle cx="256" cy="256" r="12" fill="url(#center)"/>
</svg>
